name: Finiata
description: >-
  Finiata was a Berlin-founded fintech providing working-capital and invoice
  financing to small businesses, freelancers and micro-enterprises, operating
  principally in Germany and Poland and backed by investors including Point
  Nine. It was surfaced as a portfolio company of point-nine and added to the
  API Evangelist network as a lead for enrichment. As of the 2026-07-20
  enrichment pass Finiata has no live public surface: finiata.com is
  registered but fully undelegated (no NS, SOA, A, MX or TXT records) and does
  not resolve; the former developer portal developer.finiata.com, archived as
  live in 2019, no longer resolves; and finiata.de has been taken over by
  unrelated third-party gambling-affiliate content. The only live first-party
  assets found are the company's GitHub organization (github.com/debitech) and
  one unmaintained internal npm tooling package. No API, OpenAPI or other
  machine-readable specification, documentation, or well-known surface exists
  to catalog.
