x-enrichment-note: >-
  Re-probed 2026-07-20 and the 2026-07-19 finding is confirmed and extended.
  finiata.com: no NS/SOA/A/MX/TXT records, HTTPS request returns no response
  (curl 000); every subdomain is therefore dead, including the
  developer.finiata.com portal that the Wayback Machine shows returning 200 in
  2019. finiata.pl: no NS/SOA/A records. finiata.de: resolves via Cloudflare
  and returns 200 but now serves unrelated third-party gambling-affiliate
  content ("Chicken Road 2"), i.e. the domain has left Finiata's control.
  probe-domain-security.py reported "unreachable" (no TLS/HSTS/DNSSEC/CAA/
  SPF/DMARC data obtainable); probe-security-programs.py reported vdp=none
  trust=none. New this pass: github.com/debitech was verified live (HTTP 200)
  as Finiata's GitHub organization, holding 11 mostly-forked public repos
  (coding challenges, a Creditsafe SOAP client fork, a landing page) with no
  first-party API spec or client SDK; and npm carries one first-party package,
  cz-finiata, a 2017 Commitizen release-tooling adapter published from
  martin@finiata.com, captured in packages/. No OpenAPI, AsyncAPI, GraphQL,
  webhook, well-known, security.txt, MCP, llms.txt, sandbox, changelog, CLI or
  status-page surface exists, so no further artifact could be searched,
  derived or probed without fabrication. Re-check on a future run.
